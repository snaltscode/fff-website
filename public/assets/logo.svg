<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="emeraldBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#043829"/>
      <stop offset="70%" stop-color="#02241a"/>
      <stop offset="100%" stop-color="#01140e"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE79A"/>
      <stop offset="30%" stop-color="#F3C358"/>
      <stop offset="70%" stop-color="#C7942C"/>
      <stop offset="100%" stop-color="#8E6312"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Dark Emerald Textured Canvas -->
  <rect width="500" height="500" rx="30" fill="url(#emeraldBg)"/>
  
  <!-- Intertwined Gold Monogram Emblem -->
  <g transform="translate(250, 250) scale(1.1)" filter="url(#goldGlow)">
    <!-- Main Loop System -->
    <path d="M 0,-110 C -40,-110 -70,-80 -70,-40 C -70,-10 -50,10 -20,30 L -90,100 L -60,130 L 0,70 L 60,130 L 90,100 L 20,30 C 50,10 70,-10 70,-40 C 70,-80 40,-110 0,-110 Z" fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Intertwined Arch & Inner Loops -->
    <circle cx="-35" cy="-35" r="35" fill="none" stroke="url(#goldGrad)" stroke-width="16"/>
    <circle cx="35" cy="-35" r="35" fill="none" stroke="url(#goldGrad)" stroke-width="16"/>
    <circle cx="0" cy="-65" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="14"/>
    <path d="M -80,50 Q 0,110 80,50" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>
    <line x1="-70" y1="90" x2="70" y2="90" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
