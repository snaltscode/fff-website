<script>

  // Simple client-side micro-interactions for the Admin Console

  document.addEventListener('DOMContentLoaded', () => {

    // 1. Export Menu Toggle

    const exportBtn = document.getElementById('exportBtn');

    const exportMenu = document.getElementById('exportMenu');

    if (exportBtn && exportMenu) {

      exportBtn.addEventListener('click', (e) => {

        e.stopPropagation();

        exportMenu.classList.toggle('hidden');

      });

      document.addEventListener('click', () => {

        exportMenu.classList.add('hidden');

      });

    }



    // 2. Filter Pills for Applications Table

    const filterTabs = document.querySelectorAll('.filter-tab');

    filterTabs.forEach((tab) => {

      tab.addEventListener('click', () => {

        filterTabs.forEach((t) => {

          t.classList.remove('bg-surface-card', 'text-primary', 'shadow-sm');

          t.classList.add('text-text-secondary');

        });

        tab.classList.add('bg-surface-card', 'text-primary', 'shadow-sm');

        tab.classList.remove('text-text-secondary');

      });

    });



    // 3. Save CMS Notification simulation

    const saveCmsBtn = document.getElementById('saveCmsBtn');

    if (saveCmsBtn) {

      saveCmsBtn.addEventListener('click', () => {

        const originalText = saveCmsBtn.innerHTML;

        saveCmsBtn.innerHTML = `<span class="material-symbols-outlined text-[18px]">done</span><span>Settings Synchronized!</span>`;

        saveCmsBtn.classList.add('bg-emerald-deep');

        setTimeout(() => {

          saveCmsBtn.innerHTML = originalText;

          saveCmsBtn.classList.remove('bg-emerald-deep');

        }, 2200);

      });

    }

  });

</script>
